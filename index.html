<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공업 일반 마스터</title>
<meta name="description" content="고등학교 공업 일반 전 단원 배우기·테스트·과제 제출 학습도구">
<style>
:root{
  --bg:#070d1c; --bg2:#0b1428; --card:#0d1a33; --card2:#111f3d;
  --line:#243456; --line2:#1a2a4a;
  --tx:#eaf1ff; --tx2:#9db0d6; --tx3:#6c80aa;
  --cy:#22d3ee; --bl:#3b82f6; --gr:#34d399; --am:#fbbf24; --rd:#fb7185; --pu:#a78bfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(1200px 700px at 50% -10%,#122448 0%,var(--bg) 60%) fixed;
  color:var(--tx);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  line-height:1.6;padding-bottom:40px;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:16px 15px 0}
button{font-family:inherit}
.hidden{display:none!important}

/* ── 상단 바 ── */
.top{display:flex;align-items:center;gap:10px;padding:6px 2px 14px}
.top .logo{font-size:26px}
.top h1{font-size:19px;font-weight:900;margin:0;letter-spacing:-.5px;flex:1}
.top .sub{font-size:11.5px;color:var(--tx3);font-weight:700}
.btn-back{background:var(--card);border:1px solid var(--line);color:var(--tx2);
  border-radius:10px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer}
.btn-back:active{transform:translateY(1px)}

/* ── 홈 히어로 ── */
.hero{background:linear-gradient(145deg,#14264d,#0c1730);border:1px solid var(--line);
  border-radius:20px;padding:20px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero h2{margin:0 0 6px;font-size:22px;font-weight:900;letter-spacing:-.6px}
.hero p{margin:0;color:var(--tx2);font-size:13.5px}
.hero .prog{margin-top:14px;display:flex;align-items:center;gap:10px}
.hero .bar{flex:1;height:11px;background:#0a1730;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.hero .bar>i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--cy),var(--bl));transition:width .6s cubic-bezier(.2,.7,.3,1)}
.hero .pct{font-size:13px;font-weight:900;color:var(--cy);min-width:38px;text-align:right}
.hero .spark{position:absolute;right:-10px;top:-10px;font-size:90px;opacity:.08;transform:rotate(-12deg)}

/* ── 랭크(계급) ── */
.rank{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#101d38,#0b1428);
  border:1px solid var(--line);border-radius:18px;padding:14px 15px;margin-bottom:14px;position:relative;overflow:hidden}
.rank .emb{flex-shrink:0;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.rank .m{flex:1;min-width:0}
.rank .tn{font-size:20px;font-weight:900;letter-spacing:-.4px;line-height:1.15}
.rank .rp{font-size:12.5px;color:var(--tx2);font-weight:800;margin-top:2px}
.rank .rp b{color:var(--cy)}
.rank .nx{margin-top:8px}
.rank .nxbar{height:9px;background:#08142a;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.rank .nxbar>i{display:block;height:100%;width:0;border-radius:99px;transition:width .7s cubic-bezier(.2,.7,.3,1)}
.rank .nxtx{font-size:11px;color:var(--tx3);font-weight:800;margin-top:4px}
.rank .nxtx b{color:var(--am)}
.rank .maxed{font-size:12px;color:var(--pu);font-weight:900;margin-top:6px}
.tierline{display:flex;gap:3px;margin-top:9px}
.tierline i{flex:1;height:5px;border-radius:99px;background:#1a2942}
.tierline i.on{background:var(--cy)}

/* 결과화면 RP */
.rpgain{margin:14px 0 4px;background:#0a1730;border:1px solid var(--line2);border-radius:14px;padding:13px}
.rpgain .g{font-size:26px;font-weight:900;color:var(--am);line-height:1}
.rpgain .l{font-size:11.5px;color:var(--tx3);font-weight:800;margin-top:3px}
.rpgain .brk{font-size:12px;color:var(--tx2);margin-top:8px;line-height:1.7}
.rpgain .brk span{display:inline-block;margin:0 5px}
.rpgain .newrec{display:inline-block;font-size:11px;font-weight:900;color:#062;background:var(--gr);
  border-radius:99px;padding:2px 9px;margin-left:6px}
.rpgain .norec{font-size:11.5px;color:var(--tx3);font-weight:700;margin-top:6px}

/* ── 단원 카드 ── */
.units{display:grid;gap:11px}
.ucard{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px 15px;cursor:pointer;transition:.16s;text-align:left;width:100%;color:inherit}
.ucard:hover{border-color:#31518c;background:var(--card2);transform:translateY(-2px)}
.ucard:active{transform:translateY(0)}
.ucard .ic{font-size:30px;width:44px;text-align:center;flex-shrink:0}
.ucard .m{flex:1;min-width:0}
.ucard .no{font-size:11px;font-weight:900;color:var(--cy);letter-spacing:.5px}
.ucard .ti{font-size:16.5px;font-weight:900;margin-top:1px}
.ucard .de{font-size:12px;color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ucard .rt{text-align:right;flex-shrink:0}
.ucard .ring{font-size:12px;font-weight:900;color:var(--tx2)}
.ucard .ring b{color:var(--gr)}
.ucard .arr{color:var(--tx3);font-size:20px;margin-left:2px}

/* ── 주제 리스트 ── */
.tlist{display:grid;gap:10px}
.trow{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px}
.trow .th{display:flex;align-items:center;gap:10px}
.trow .tic{font-size:22px}
.trow .tt{font-size:15.5px;font-weight:900;flex:1}
.trow .badges{display:flex;gap:5px}
.chip{font-size:10.5px;font-weight:900;padding:3px 7px;border-radius:99px;border:1px solid var(--line2);color:var(--tx3)}
.chip.done{background:#0f2e24;border-color:#1f6b4f;color:var(--gr)}
.chip.gold{background:#3a2f10;border-color:#7a5c14;color:var(--am)}
.trow .acts{display:flex;gap:8px;margin-top:11px}
.act{flex:1;border:0;border-radius:12px;padding:11px;font-size:14px;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px}
.act:active{transform:translateY(1px)}
.act.learn{background:linear-gradient(135deg,#1f3a6b,#16294d);color:#cfe0ff;border:1px solid #2f4a80}
.act.test{background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff}
.act small{font-size:10.5px;font-weight:800;opacity:.8}

/* ── 배우기 ── */
.stage{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 17px;min-height:340px;
  display:flex;flex-direction:column}
.stage .kick{font-size:12px;font-weight:900;color:var(--cy);letter-spacing:.5px}
.learn-card h3{font-size:19px;font-weight:900;margin:6px 0 12px;letter-spacing:-.4px}
.intro-box{background:#0a1730;border:1px solid var(--line2);border-radius:14px;padding:14px 15px;font-size:14.5px;color:var(--tx);line-height:1.72}
.intro-box b{color:var(--cy)}
.reassure{margin-top:14px;font-size:13px;color:var(--gr);font-weight:800}
ul.pts{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:9px}
ul.pts li{position:relative;padding:10px 12px 10px 34px;background:#0a1730;border:1px solid var(--line2);
  border-radius:12px;font-size:14px;color:var(--tx)}
ul.pts li:before{content:"✦";position:absolute;left:12px;top:10px;color:var(--cy);font-weight:900}
ul.pts li b{color:#eaf1ff;background:linear-gradient(transparent 62%,rgba(34,211,238,.28) 62%);padding:0 1px}
/* ── 직접 그린 도식 ── */
.drawnwrap{margin:2px 0 12px;background:#0a1425;border:1px solid var(--line);
  border-radius:14px;padding:8px}
.drawnwrap svg.drawn{width:100%;height:auto;display:block}
/* ── 교과서 도판 ── */
.figwrap{margin:2px 0 12px;display:grid;gap:10px}
img.bookfig{width:100%;height:auto;display:block;border-radius:12px;background:#fff;
  border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.figcap{font-size:11.5px;color:var(--tx3);text-align:center;font-weight:700}

table.lt{width:100%;border-collapse:collapse;margin-top:4px;font-size:13px}
table.lt th{background:#122448;color:var(--cy);font-weight:900;padding:8px 9px;border:1px solid var(--line);text-align:left;font-size:12px}
table.lt td{padding:8px 9px;border:1px solid var(--line2);color:var(--tx);vertical-align:top}
table.lt td b{color:#fff}
.stage .body{flex:1}
details.more{margin-top:12px;background:#0a1730;border:1px dashed #33507f;border-radius:12px;overflow:hidden}
details.more>summary{list-style:none;cursor:pointer;padding:11px 13px;font-size:13.5px;font-weight:900;
  color:var(--am);display:flex;align-items:center;gap:6px;user-select:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary:after{content:"펼치기 ▾";margin-left:auto;font-size:11px;color:var(--tx3);font-weight:800}
details.more[open]>summary:after{content:"접기 ▴"}
details.more[open]>summary{border-bottom:1px dashed #33507f}
.more-body{padding:12px 13px 4px}
.more-body .pts li{background:#0c1c38}
.pager{display:flex;align-items:center;gap:8px;margin-top:16px}
.dots{flex:1;display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line);display:block}
.dots i.on{background:var(--cy);transform:scale(1.25)}
.dots i.seen{background:#2f6b8c}
.pg-btn{border:0;border-radius:11px;padding:11px 16px;font-size:14px;font-weight:900;cursor:pointer;
  background:var(--card2);color:var(--tx2);border:1px solid var(--line)}
.pg-btn.primary{background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;border:0}
.pg-btn:disabled{opacity:.35}
.pg-btn:active{transform:translateY(1px)}

/* ── 테스트 ── */
.hud-wrap{margin-bottom:12px}
.climb{background:#0a1730;border:1px solid var(--line2);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.climb .lab{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--tx3);margin-bottom:7px}
.climb svg{display:block;width:100%;height:56px}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px 16px}
.q-no{font-size:12px;font-weight:900;color:var(--am)}
.q-txt{font-size:17px;font-weight:800;margin:6px 0 15px;line-height:1.5}
.q-txt b{color:var(--am)}
.opts{display:grid;gap:9px}
.opt{text-align:left;background:#0a1730;border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;
  font-size:14.5px;font-weight:700;color:var(--tx);cursor:pointer;transition:.13s;display:flex;gap:10px;align-items:flex-start}
.opt .k{font-weight:900;color:var(--cy);flex-shrink:0}
.opt:hover{border-color:#31518c}
.opt:active{transform:scale(.99)}
.opt.correct{background:#0f2e24;border-color:var(--gr);color:#d6ffee}
.opt.correct .k{color:var(--gr)}
.opt.wrong{background:#3a1620;border-color:var(--rd);color:#ffd9e0}
.opt.wrong .k{color:var(--rd)}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default}
.why{margin-top:12px;background:#0a1730;border:1px solid var(--line2);border-left:3px solid var(--cy);
  border-radius:10px;padding:11px 13px;font-size:13.5px;color:var(--tx2);display:none}
.why.on{display:block;animation:fadein .3s}
.why b{color:var(--cy)}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.next-row{margin-top:14px;display:flex;justify-content:flex-end}

/* ── 결과 ── */
.result{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;text-align:center}
.result .big{font-size:52px;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--cy),var(--bl));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.result .lab{font-size:13px;color:var(--tx3);font-weight:800;margin-top:4px}
.result .stars{font-size:34px;letter-spacing:5px;margin:12px 0}
.result .msg{font-size:15px;font-weight:800;margin-bottom:4px}
.result .detail{font-size:13px;color:var(--tx2)}
.rev{margin:16px 0 4px;text-align:left;display:grid;gap:7px}
.rev .ri{font-size:13px;padding:9px 11px;border-radius:10px;background:#0a1730;border:1px solid var(--line2)}
.rev .ri.ok{border-left:3px solid var(--gr)}
.rev .ri.no{border-left:3px solid var(--rd)}
.rev .ri .q{font-weight:800;color:var(--tx)}
.rev .ri .a{color:var(--tx2);margin-top:3px}
.rbtns{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.rbtns button{flex:1;min-width:130px;border:0;border-radius:13px;padding:13px;font-size:14.5px;font-weight:900;cursor:pointer}
.rbtns .submit{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
/* ── 종합시험 · 오답노트 (규약 §2) ── */
.examcard{display:block;width:100%;text-align:left;margin:12px 0 0;padding:16px 18px;cursor:pointer;
  background:linear-gradient(135deg,#2a2140,#1b2140);border:1px solid #4a3d78;border-radius:16px;color:var(--tx)}
.examcard:hover{border-color:var(--am)}
.examcard .t{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.examcard .d{font-size:12.5px;color:var(--tx3);margin-top:5px;line-height:1.55;font-weight:700}
.examrule{background:#2a2135;border:1px solid #574372;border-radius:13px;padding:13px 15px;
  font-size:13px;line-height:1.65;color:#e6dcff;margin:12px 0}
.wnote{margin:16px 0 4px;text-align:left}
.wnote h4{margin:0 0 10px;font-size:14.5px}
.wnq{background:#0a1730;border:1px solid var(--line2);border-radius:13px;padding:13px 15px;margin-bottom:10px}
.wnq .n{font-size:12px;font-weight:800;color:var(--tx3);margin-bottom:5px}
.wnq .qq{font-weight:800;font-size:14.5px;line-height:1.55;color:var(--tx)}
.wnl{border-radius:9px;padding:8px 10px;font-size:13.2px;margin-top:6px;line-height:1.5;color:var(--tx2)}
.wnl b{color:var(--tx)}
.wnl.bad{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.45)}
.wnl.bad b{color:var(--rd)}
.wnl.good{background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.45)}
.wnl.good b{color:var(--gr)}
.wnw{margin-top:8px;font-size:13.2px;line-height:1.6;color:var(--tx2);
  background:rgba(56,132,255,.08);border:1px solid rgba(56,132,255,.28);border-radius:9px;padding:8px 10px}
.wnall{border:1px dashed var(--line2);border-radius:13px;padding:18px;text-align:center;font-weight:800}
.rbtns .retry{background:var(--card2);color:var(--tx2);border:1px solid var(--line)!important}
.rbtns .home{background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff}

/* ── 하단 정보/도움 ── */
.foot{margin-top:22px;padding:14px;border:1px dashed var(--line);border-radius:14px;color:var(--tx3);font-size:12px;line-height:1.7}
.foot b{color:var(--tx2)}
.tag{display:inline-block;font-size:11px;font-weight:900;color:var(--cy);background:#0a2733;border:1px solid #1c4b5c;border-radius:99px;padding:2px 9px;margin-right:5px}

@media (max-width:480px){
  .hero h2{font-size:19px}
  .q-txt{font-size:16px}
  .ucard .de{max-width:180px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.figfail{color:#ff9a9a;font-size:15px;font-weight:700;text-align:center;padding:14px}
</style>
</head>

  <div class="top">
    <button class="btn-back hidden" id="backBtn" onclick="goBack()">←</button>
    <span class="logo" id="logo">💼</span>

      <h1 id="crumb">공업 일반 마스터</h1>

<script src="https://hongyul67-cpu.github.io/links/fx.js"></script>
<script src="https://hongyul67-cpu.github.io/links/collector.js"
        data-tool="공업 일반"></script>
<script>
/* ── 공업 일반 — 생기부 키워드 ──
   · 이 도구는 자체 RP·계급 화면을 이미 가지고 있어 공용 rank.js 는 붙이지 않는다.
   · 생기부: 제출할 때 활동명·도전횟수가 자동으로 얹혀 키워드·문장 초안이 만들어진다. */
(function(){
  var MODE_NAME = '공업 일반';
  var TRY_KEY   = 'try_gongil';

  function bumpTry(m){
    var d={}; try{ d=JSON.parse(localStorage.getItem(TRY_KEY))||{}; }catch(e){}
    d[m]=(d[m]||0)+1;
    try{ localStorage.setItem(TRY_KEY, JSON.stringify(d)); }catch(e){}
    return d[m];
  }

  window.RankKit = {
    mode: MODE_NAME,
    /* 채점이 끝난 지점에서 호출 — RP 정산 + 승급 연출 */
    award: function(pct, mode){
      /* 이 도구는 자체 RP·계급 체계를 쓰므로, 여기서는 활동명만 기억해 둔다 */
      if(mode) window.RankKit.lastMode = mode;
      return null;
    }
  };

  /* 생기부 — 제출 payload 에 활동명·도전횟수를 자동으로 붙인다 */
  var t=setInterval(function(){
    if(!window.ResultCollector) return;
    clearInterval(t);
    if(ResultCollector.__kit) return;
    ResultCollector.__kit=1;
    var orig=ResultCollector.open;
    ResultCollector.open=function(p){
      p=p||{};
      var m=p.mode||window.RankKit.lastMode||MODE_NAME;
      p.mode=m;
      if(p.retry===undefined) p.retry=bumpTry(m);

      return orig.call(this,p);
    };
  }, 60);
})();
</script>

<script>
"use strict";
/* ══════════════ 상태 ══════════════ */
var UNITS;
var TOPICS = {};                 // id → {topic, unit}
var ALL_TOPICS = [];

var LS_LEARN="gim_learn_v1", LS_BEST="gim_best_v1";
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||"{}"); }catch(e){ return {}; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
var learned=load(LS_LEARN);      // id → true (배우기 끝냄)
var best=load(LS_BEST);          // id → {correct,total,stars}
var LS_RP="gim_rp_v1";
var rp=load(LS_RP);              // id → 그 주제에서 얻은 '최고' RP (재시험해도 최고 기록만 쌓임)

/* ══════════════ 랭크(계급) 시스템 ══════════════
   RP = 주제별 최고 점수의 합.  같은 주제를 반복해도 최고 기록만 반영 → 무한 파밍 불가.
   한 주제 만점 = 정답×10 + 별3 50 + 만점 50
   한 판에 나오는 문항은 TEST_MAX(16개)로 제한되므로 전 주제 만점은 4870점이다.
   ※ 티어 구간은 그 만점에 맞춰 잡았다. 마스터 = 4380(약 90%) */
var TIERS=[
  {n:"아이언",   min:0,    c:"#8d949e", c2:"#5a6069", ic:"🪨"},
  {n:"브론즈",   min:355,  c:"#c9803f", c2:"#8a5427", ic:"🥉"},
  {n:"실버",     min:860,  c:"#c3ccdc", c2:"#7e8899", ic:"🥈"},
  {n:"골드",     min:1430, c:"#ffc93c", c2:"#b8860b", ic:"🥇"},
  {n:"플래티넘", min:2110, c:"#4fd1c5", c2:"#1d7d75", ic:"💠"},
  {n:"에메랄드", min:2860, c:"#34d399", c2:"#177852", ic:"💚"},
  {n:"다이아",   min:3660, c:"#7cc6ff", c2:"#2b6ca3", ic:"💎"},
  {n:"마스터",   min:4380, c:"#c084fc", c2:"#7127b8", ic:"👑"}
];
function totalRP(){
  var s=0; for(var k in rp){ if(rp.hasOwnProperty(k)) s+=(rp[k]||0); } return s;
}
function tierOf(p){
  var t=TIERS[0];
  for(var i=0;i<TIERS.length;i++){ if(p>=TIERS[i].min) t=TIERS[i]; }
  return t;
}
function nextTier(p){
  for(var i=0;i<TIERS.length;i++){ if(p<TIERS[i].min) return TIERS[i]; }
  return null;   // 마스터 도달
}
function calcRP(correct,total,stars){
  return correct*10 + (stars===3?50:(stars===2?25:(stars===1?10:0))) + (correct===total?50:0);
}
/* 한 번에 푸는 문항 수 상한.
   주제마다 문항이 9~31개로 들쭉날쭉해서, 31개짜리는 학생이 지친다.
   문항은 전부 남겨 두고(종합시험은 322개 전체에서 뽑는다) 한 판에 나오는 수만 제한한다.
   → 다시 풀면 다른 문항이 나오므로 반복 학습에도 낫다. */
var TEST_MAX=16;
function pickTopicQs(t){
  var pool=t.quiz.slice();
  if(pool.length<=TEST_MAX) return pool;
  for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=pool[i];pool[i]=pool[j];pool[j]=tmp; }
  return pool.slice(0,TEST_MAX);
}
function testCount(t){ return Math.min(t.quiz.length, TEST_MAX); }

/* 한 판에 나오는 문항이 TEST_MAX 로 제한되므로 만점도 그 기준으로 잡는다 */
function maxRPof(t){ return testCount(t)*10 + 50 + 50; }
var MAXRP=0;   // 전 주제 만점 시 총점 (안내문·밸런스 확인용)
/* 티어 엠블럼 (SVG) */
function tierBadge(t,size){
  var s=size||64;
  return '<svg viewBox="0 0 100 100" width="'+s+'" height="'+s+'" style="display:block">'+
    '<defs><linearGradient id="tg'+t.n+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="'+t.c+'"/><stop offset="1" stop-color="'+t.c2+'"/></linearGradient></defs>'+
    '<path d="M50 6 L88 24 V54 C88 74 70 88 50 95 C30 88 12 74 12 54 V24 Z" '+
    'fill="url(#tg'+t.n+')" stroke="'+t.c+'" stroke-width="3" stroke-linejoin="round"/>'+
    '<path d="M50 16 L78 29 V54 C78 68 65 79 50 85 C35 79 22 68 22 54 V29 Z" '+
    'fill="rgba(0,0,0,.26)"/>'+
    '<text x="50" y="62" font-size="34" text-anchor="middle">'+t.ic+'</text></svg>';
}

function blockHTML(c){
  var out='';
  /* fig = 교과서 도판(img/…). 문자열 하나 또는 배열로 넣는다.
     figcap 은 그림 아래 붙는 짧은 설명(선택). */
  /* svg = figs.js 의 직접 그린 도식 키. 교과서 도판보다 먼저 보여 준다.
     교과서 크롭은 폰에서 글씨가 뭉개지므로, 개념은 이 도식으로 먼저 잡게 한다. */
  if(c.svg && window.DRAWN_FIGS && DRAWN_FIGS[c.svg]){

  }
  if(c.fig){

    out+='<div class="figwrap">'+ figs.map(function(f){
      /* 카드는 한 장씩만 그려지므로 lazy 를 쓰지 않는다(즉시 표시) */
      return '<img class="bookfig" data-enc="'+f.replace(/^img\//,'')+'" alt="교과서 도판">';
    }).join('') + (c.figcap?'<div class="figcap">'+c.figcap+'</div>':'') + '</div>';
  }
  if(c.table){
    out+='<table class="lt"><tr>'+c.table.head.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr>';
    c.table.rows.forEach(function(r){ out+='<tr>'+r.map(function(x){return '<td>'+x+'</td>';}).join('')+'</tr>'; });
    out+='</table>';
  }
  if(c.pts && c.pts.length){
    out+='<ul class="pts"'+(c.table?' style="margin-top:10px"':'')+'>'+
         c.pts.map(function(p){return '<li>'+p+'</li>';}).join('')+'</ul>';
  }
  return out;
}

/* ══════════════ 종합시험 (규약 §2) ══════════════
   · 전 단원 20문항 · 푸는 동안 정답·해설·점수 감춤 · 끝난 뒤 오답노트 → 그 아래 제출 */
var EXAM_N=20;
function shuffleArr(a){ a=a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a; }
/* 주제를 돌아가며 뽑아 한 단원에 쏠리지 않게 한다 */
function pickExamQs(n){
  var buckets=ALL_TOPICS.map(function(t){
    return shuffleArr(t.quiz).map(function(q){ return {q:q, topic:t}; });
  });
  buckets=shuffleArr(buckets);
  var out=[];
  for(var round=0; out.length<n; round++){
    var added=0;
    for(var b=0;b<buckets.length && out.length<n;b++){
      if(buckets[b].length>round){ out.push(buckets[b][round]); added++; }
    }
    if(!added) break;
  }
  return shuffleArr(out).map(function(it){
    var q=it.q;
    var idx=shuffleArr(q.opts.map(function(_,i){return i;}));
    return { q:q.q, why:q.why, opts:idx.map(function(i){return q.opts[i];}),
             a:idx.indexOf(q.a), topic:it.topic.title };
  });
}
function startExam(){
  var qs=pickExamQs(EXAM_N);
  if(!qs.length){ alert('출제할 문항이 없습니다.'); return; }
  stack=[renderHome];
  setCrumb("🧪","종합시험","전 단원 "+qs.length+"문항 · 채점은 마지막에");
  T={ id:'__exam', t:{title:'종합시험'}, u:{key:null,no:'',title:'전 단원'},
      qs:qs, i:0, correct:0, miss:0, wrong:[], picks:[], answered:false,
      t0:Date.now(), exam:true };
  if(window.FX) FX.reset();
  renderQ();
}

    return { q:q.q, why:q.why, opts:idx.map(function(i){return q.opts[i];}), a:idx.indexOf(q.a) };
  });

function climbSVG(step,total){
  // 진행 = 계단을 올라 목표(빌딩·깃발)로. 주제와 연결된 진행 그림.
  var W=100,H=32,n=total;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  // 계단
  for(var k=0;k<n;k++){
    var x=6+ (W-20)*(k/n);
    var y=H-4-(H-10)*(k/n);
    var done=k<step;
    svg+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+((W-20)/n-1.2).toFixed(1)+'" height="3.4" rx="1.6" fill="'+(done?'#22d3ee':'#233457')+'"/>';
  }
  // 깃발(목표)
  svg+='<text x="'+(W-9)+'" y="9" font-size="9" text-anchor="middle">🏢</text>';
  // 사람 위치
  var px=6+(W-20)*(step/n), py=H-6-(H-10)*(step/n);
  svg+='<text x="'+px.toFixed(1)+'" y="'+py.toFixed(1)+'" font-size="8" text-anchor="middle">🧑‍💼</text>';
  svg+='</svg>';
  return svg;
}
function renderQ(){
  var q=T.qs[T.i];
  T.answered=false;
  var h='';
  if(!T.exam) h+='<div class="hud-wrap"><div id="hud"></div></div>';   // 시험 중 점수 감춤
  h+='<div class="climb"><div class="lab"><span>진행</span><span>'+(T.i)+' / '+T.qs.length+' 통과</span></div>'+climbSVG(T.i,T.qs.length)+'</div>';
  if(T.exam) h+='<div class="examrule">🧪 <b>종합시험</b> — 보기를 누르면 바로 다음 문제로 넘어갑니다. '+
     '정답·해설은 <b>끝까지 푼 뒤</b> 오답노트에서 확인해요.</div>';
  h+='<div class="q-card"><div class="q-no">Q'+(T.i+1)+' / '+T.qs.length+'</div>'+
     '<div class="q-txt">'+q.q+'</div><div class="opts" id="opts">';
  var K=["A","B","C","D","E"];
  q.opts.forEach(function(o,i){
    h+='<button class="opt" data-i="'+i+'" onclick="answer('+i+')"><span class="k">'+K[i]+'</span><span>'+o+'</span></button>';
  });
  h+='</div><div class="why" id="why"></div>'+
     '<div class="next-row"><button class="pg-btn primary hidden" id="nextBtn" onclick="nextQ()">'+
     (T.i===T.qs.length-1?'결과 보기 →':'다음 문제 →')+'</button></div></div>';
  document.getElementById("test").innerHTML=h;
  if(window.FX && !T.exam) FX.hud(document.getElementById("hud"));
  show("test");
}
function answer(i){
  if(!T || T.done || T.answered) return;   // 채점이 끝난 화면의 보기를 다시 눌러도 반응하지 않게
  var q=T.qs[T.i];
  T.picks[T.i]=i;
  if(T.exam){
    // 시험: 정답·해설·효과음 없이 바로 다음 문제로 (채점은 마지막에)
    if(i===q.a) T.correct++; else { T.miss++; T.wrong.push(T.i+1); }
    nextQ();
    return;
  }
  T.answered=true;
  var btns=document.querySelectorAll("#opts .opt");
  btns.forEach(function(b){ b.setAttribute("disabled","1");
    var bi=+b.dataset.i;
    if(bi===q.a) b.classList.add("correct");
    else if(bi===i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  var el=btns[i];
  if(i===q.a){ T.correct++; if(window.FX) FX.ok(el); }
  else{ T.miss++; T.wrong.push(T.i+1); if(window.FX) FX.no(el);
    document.querySelectorAll("#opts .opt")[q.a].classList.remove("dim"); }
  var why=document.getElementById("why");
  why.innerHTML='<b>'+(i===q.a?'정답! ':'정답: '+["A","B","C","D","E"][q.a]+'. ')+'</b>'+q.why;
  why.classList.add("on");
  document.getElementById("nextBtn").classList.remove("hidden");
}
function nextQ(){
  if(T.i<T.qs.length-1){ T.i++; renderQ(); }
  else finishTest();
}
function finishTest(){
  if(T.done) return;
  T.done=true;
  var total=T.qs.length, correct=T.correct;
  var stars = window.FX ? FX.starsFor(T.miss) : (T.miss===0?3:(T.miss<=2?2:(T.miss<=5?1:0)));
  var dur=Math.round((Date.now()-T.t0)/1000);
  // 최고 기록 갱신
  var prev=best[T.id];
  if(!prev || correct>prev.correct || (correct===prev.correct && stars>prev.stars)){
    best[T.id]={correct:correct,total:total,stars:stars}; save(LS_BEST,best);
  }

  /* ── 랭크 점수(RP) ── 주제별 '최고 RP'만 반영해 반복 파밍을 막는다 ── */
  var beforeRP=totalRP(), beforeTier=tierOf(beforeRP);
  var earned=calcRP(correct,total,stars);
  var prevRP=rp[T.id]||0;
  var isRec=earned>prevRP;
  if(isRec){ rp[T.id]=earned; save(LS_RP,rp); }
  var afterRP=totalRP(), afterTier=tierOf(afterRP);
  var rankedUp = afterTier.min>beforeTier.min;

  renderResult(correct,total,stars,dur,{earned:earned,prev:prevRP,isRec:isRec,
    gain:afterRP-beforeRP, totalRP:afterRP, tier:afterTier});

  // 배너 연출 — 승급하면 승급 배너를 먼저 크게
  var pct=Math.round(correct/total*100);
  if(window.FX){
    setTimeout(function(){
      if(rankedUp){
        FX.banner({icon:afterTier.ic, title:afterTier.n+" 승급!",
          sub:"축하합니다 — <b style='color:"+afterTier.c+"'>"+beforeTier.n+" → "+afterTier.n+"</b><br>총 "+afterRP+" RP",
          stars:false, btn:"확인 →", onClose:function(){
            FX.banner({icon: stars>=3?"🏆":"🎉", title:"+"+(afterRP-beforeRP)+" RP",
              sub:T.t.title+" · "+correct+" / "+total+" 정답", stars:stars, btn:"결과 확인 →"});
          }});
      } else {
        FX.banner({icon: stars>=3?"🏆":(stars>=1?"🎉":"💪"),
          title: stars>=3?"완벽해요!":(pct>=60?"통과!":"조금 더!"),
          sub: T.t.title+" · "+correct+" / "+total+" 정답"+
               (isRec?"<br><b style='color:#fbbf24'>+"+(afterRP-beforeRP)+" RP 획득!</b>":""),
          stars:stars, btn:"결과 확인 →"});
      }
    },520);
  }
}
function renderResult(correct,total,stars,dur,R){
  var u=T.u, t=T.t, pct=Math.round(correct/total*100);
  stack = T.exam ? [renderHome] : [renderHome, function(){renderUnit(u.key);}];
  if(T.exam) setCrumb("🧪","종합시험 결과","전 단원 "+total+"문항");
  else setCrumb("🎯",t.title+" 결과",u.no+"단원");
  var msg = stars>=3?"완벽합니다. 이 주제는 마스터했어요!":(pct>=60?"잘했어요. 틀린 것만 다시 보면 완벽!":"괜찮아요. 배우기로 한 번 더 훑어봐요.");
  var h='<div class="result">'+
    '<div class="big" id="bigScore">0</div><div class="lab">점 (100점 만점)</div>'+
    '<div class="stars">'+ '★'.repeat(stars)+'<span style="opacity:.25">'+'★'.repeat(3-stars)+'</span></div>'+
    '<div class="msg">'+msg+'</div>'+
    '<div class="detail">'+correct+' / '+total+' 정답 · '+dur+'초 소요</div>';

  // ── 랭크 점수 ──
  if(R){
    var starB=(stars===3?50:(stars===2?25:(stars===1?10:0)));
    h+='<div class="rpgain">'+
       '<div class="g">+<span id="rpNum">0</span> RP'+(R.isRec?'<span class="newrec">신기록!</span>':'')+'</div>'+
       '<div class="l">이번 판 점수</div>'+
       '<div class="brk"><span>정답 '+correct+'×10 = <b style="color:var(--cy)">'+(correct*10)+'</b></span>'+
       '<span>별 '+stars+'개 <b style="color:var(--am)">+'+starB+'</b></span>'+
       (correct===total?'<span>만점 <b style="color:var(--gr)">+50</b></span>':'')+'</div>'+
       (R.isRec
         ? '<div class="norec" style="color:var(--gr)">이 주제 최고 기록 갱신 → 총 RP <b>+'+R.gain+'</b> (누적 '+R.totalRP+' RP · '+R.tier.n+')</div>'
         : '<div class="norec">이 주제 최고 기록은 <b>'+R.prev+' RP</b> — 더 잘하면 그만큼 올라갑니다 (누적 '+R.totalRP+' RP · '+R.tier.n+')</div>')+
       '</div>';
  }
  // 문항 리뷰 — 시험이면 규약대로 오답노트(번호·주제·지문·내가 고른 답·정답·해설)
  h += T.exam ? wrongNoteHTML() : reviewHTML();
  // 버튼 — 제출은 오답노트 아래, ?rc= 링크가 아니어도 항상 보인다 (규약 §1 ③)
  h+='<div class="rbtns">';
  h+='<button class="retry" onclick="'+(T.exam?'startExam()':"startTest('"+T.id+"')")+'">↻ 다시 풀기</button>';
  h+='<button class="home" onclick="'+(T.exam?'renderHome()':"renderUnit('"+u.key+"')")+'">'+(T.exam?'홈으로':'단원으로')+'</button>';
  h+='</div>';
  h+='<div id="rcAnchor"></div>';
  h+='</div>';
  document.getElementById("result").innerHTML=h;
  show("result");
  mountSubmit(correct,total,pct,dur);   // 오답노트 아래에 제출 버튼
  if(window.FX) FX.countUp(document.getElementById("bigScore"),pct,900);
  else document.getElementById("bigScore").textContent=pct;
  var rpEl=document.getElementById("rpNum");
  if(rpEl && R){
    if(window.FX) FX.countUp(rpEl,R.earned,1100);
    else rpEl.textContent=R.earned;
  }
}
/* 주제 테스트 — 풀면서 이미 정답·해설을 봤으므로 한 줄 요약 */
function reviewHTML(){
  var h='<div class="rev">', K=["A","B","C","D","E"];
  T.qs.forEach(function(q,idx){
    var no=T.wrong.indexOf(idx+1)>=0;
    h+='<div class="ri '+(no?'no':'ok')+'"><div class="q">'+(no?'\u2717':'\u2713')+' Q'+(idx+1)+'. '+q.q.replace(/<[^>]+>/g,'')+'</div>'+
       (no?'<div class="a">\u2192 \uc815\ub2f5: '+K[q.a]+') '+q.opts[q.a]+'</div>':'')+'</div>';
  });
  return h+'</div>';
}

/* 종합시험 오답노트 — 규약 §2 : 번호 · 주제 · 지문 · 내가 고른 답 · 정답 · 해설 */
function examWrongItems(){
  var out=[];
  T.qs.forEach(function(q,idx){
    var pick=T.picks[idx];
    if(pick===q.a) return;
    out.push({no:idx+1, topic:q.topic||'', q:q.q, why:q.why||'',
              pickIdx:pick, pick:(pick==null?null:q.opts[pick]),
              ansIdx:q.a, ans:q.opts[q.a]});
  });
  return out;
}
function wrongNoteHTML(){
  var K=["A","B","C","D","E"], items=examWrongItems();
  if(!items.length)
    return '<div class="wnote"><div class="wnall">\uD83C\uDFAF '+T.qs.length+'\ubb38\ud56d \uc804\ubd80 \ub9de\ud614\uc5b4\uc694! \uc624\ub2f5\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.</div></div>';
  var h='<div class="wnote"><h4>\uD83D\uDCD5 \uc624\ub2f5\ub178\ud2b8 \u2014 \ud2c0\ub9b0 '+items.length+'\ubb38\ud56d</h4>';
  items.forEach(function(w){
    h+='<div class="wnq"><div class="n">'+w.no+'\ubc88'+(w.topic?' \u00b7 '+w.topic:'')+'</div>'+
       '<div class="qq">'+w.q+'</div>'+
       '<div class="wnl bad">\u2717 \ub0b4\uac00 \uace0\ub978 \ub2f5 &nbsp;<b>'+
         (w.pick==null?'(\ubb34\uc751\ub2f5)':K[w.pickIdx]+') '+w.pick)+'</b></div>'+
       '<div class="wnl good">\u2713 \uc815\ub2f5 &nbsp;<b>'+K[w.ansIdx]+') '+w.ans+'</b></div>'+
       (w.why?'<div class="wnw">'+w.why+'</div>':'')+'</div>';
  });
  return h+'</div>';
}

/* ── 결과 제출 (파트별) — 규약 §1 ── */
function shortTxt(t,len){
  t=String(t==null?'':t).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
  return t.length>len ? t.slice(0,len-1)+'\u2026' : t;
}
/* "3번 취업 준비 · 이력서→자기소개서" 처럼 무엇을 틀렸는지 남긴다 */
function wrongDescs(){
  if(T.exam) return examWrongItems().map(function(w){
    return w.no+'\ubc88 '+(w.topic?w.topic+' \u00b7 ':'')+
           (w.pick==null?'(\ubb34\uc751\ub2f5)':shortTxt(w.pick,16))+'\u2192'+shortTxt(w.ans,16);
  });
  var out=[];
  T.qs.forEach(function(q,idx){
    var pick=T.picks[idx];
    if(pick===undefined || pick===q.a) return;
    out.push((idx+1)+'\ubc88 '+shortTxt(q.opts[pick],16)+'\u2192'+shortTxt(q.opts[q.a],16));
  });
  return out;
}
function submitMode(){
  return T.exam ? '\uacf5\uc5c5 \uc77c\ubc18 \u2014 \uc885\ud569\uc2dc\ud5d8'
                : (T.t.title||'\uacf5\uc5c5 \uc77c\ubc18')+' \u2014 \uc8fc\uc81c \ud14c\uc2a4\ud2b8';
}
/* 오답노트 아래(앵커 뒤)에 붙인다. ?rc= 링크가 아니어도 버튼은 보인다. */
function mountSubmit(correct,total,pct,dur){
  var anchor=document.getElementById('rcAnchor');
  if(!anchor || !window.ResultCollector || !ResultCollector.attach) return;
  var payload={ mode:submitMode(), score:pct, correct:correct, total:total,
    wrong:wrongDescs(), durationSec:dur,
    /* 계급 — 이 도구는 자체 랭크(RP)를 쓰므로 여기서 직접 넣는다 (다른 세션 작업 유지).
       attach 는 window.Rank 가 있을 때만 채우는데 이 도구는 그것을 싣지 않는다. */
    tier:(function(){ try{ return tierOf(totalRP()).n; }catch(e){ return undefined; } })(),
    labels:{score:"\uc810\uc218(100)", correct:"\ub9de\uc740\uac1c\uc218", total:"\ucd1d\ubb38\ud56d",
            rate:"\uc815\ub2f5\ub960(%)", wrong:"\ud2c0\ub9b0 \ubb38\uc81c"} };
  var btn=ResultCollector.attach(anchor, function(){ return payload; }, {
    id:'rcBtn', className:'submit', mode:payload.mode,
    extra:[ T.exam ? '\uc804 \ub2e8\uc6d0 \uc885\ud569 \ud3c9\uac00 \uc751\uc2dc'
                   : (T.t.title||'')+' \ud559\uc2b5 \ub0b4\uc6a9 \ud655\uc778' ]
  });
  if(btn){
    btn.style.width='100%';
    btn.style.marginTop='10px';
    btn.textContent='\uD83D\uDCE4 ['+(T.exam?'\uc885\ud569\uc2dc\ud5d8':(T.t.title||'\ud14c\uc2a4\ud2b8'))+'] \uacb0\uacfc \uc81c\ucd9c';
  }
}

/* 시작 */
/* 잠금이 풀린 뒤에야 데이터가 들어온다. 그때 앱을 시작한다. */
function boot(){
  UNITS = window.UNITS;
  UNITS.forEach(function(u){ u.topics.forEach(function(t){ TOPICS[t.id]={t:t,u:u}; }); });
  UNITS.forEach(function(u){ u.topics.forEach(function(t){ ALL_TOPICS.push(t); }); });
  MAXRP = 0;
  ALL_TOPICS.forEach(function(t){ MAXRP += maxRPof(t); });
  renderHome();
}
GIMLock.mount(boot);
</script>
